[project]
name = "sunnynui"
version = "0.1.0"
description = "Tell the look-alike cats Sunny and Nui apart on Petlibro Luma litter-box images."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=13.0.0",
    "pillow-heif>=1.9.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sunnynui"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
